openapi: 3.0.3
info:
  title: URL Shortener API
  description: |
    Simple RESTful API for shortening URLs.

paths:
  /shorten:
    post:
      summary: Shorten a URL
      description: |
        With an absent or null `customAlias`, a random 7-character alias is
        automatically generated.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - fullUrl
              properties:
                fullUrl:
                  type: string
                  maxLength: 2048
                  description: |
                    Destination URL. After trimming, it must be an absolute
                    `http` or `https` URL with a host, no user-info, and not
                    pointing at the shortener's own host.
                  example: https://example.com/very/long/url
                customAlias:
                  type: string
                  nullable: true
                  minLength: 3
                  maxLength: 64
                  pattern: '^[A-Za-z0-9_-]{3,64}$'
                  description: |
                    Case-sensitive. Must not be a reserved word, compared
                    case-insensitively.
                  example: my-custom-alias
      responses:
        '201':
          description: URL successfully shortened
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                properties:
                  shortUrl:
                    type: string
                    example: http://localhost:8080/my-custom-alias
        '400':
          description: |
            Malformed request, invalid input, or alias already taken. The
            problem `type` is one of `malformed-request`,
            `validation-failed`, or `alias-taken`.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/problem+json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/MalformedRequestProblem'
                  - $ref: '#/components/schemas/ValidationFailedProblem'
                  - $ref: '#/components/schemas/AliasTakenProblem'
                discriminator:
                  propertyName: type
                  mapping:
                    urn:problem:url-shortener:malformed-request: '#/components/schemas/MalformedRequestProblem'
                    urn:problem:url-shortener:validation-failed: '#/components/schemas/ValidationFailedProblem'
                    urn:problem:url-shortener:alias-taken: '#/components/schemas/AliasTakenProblem'
              examples:
                malformed-request:
                  value:
                    type: urn:problem:url-shortener:malformed-request
                    title: The request body is not valid JSON
                    status: 400
                validation-failed:
                  value:
                    type: urn:problem:url-shortener:validation-failed
                    title: The request is not valid
                    status: 400
                    detail: The request has 2 invalid fields.
                    errors:
                      - field: fullUrl
                        code: url-unsupported-scheme
                        message: Enter a URL starting with http:// or https://
                      - field: customAlias
                        code: alias-invalid-length
                        message: Alias must be between 3 and 64 characters
                alias-taken:
                  value:
                    type: urn:problem:url-shortener:alias-taken
                    title: The alias is already taken
                    status: 400
        '413':
          description: Request body is larger than 16 KiB
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/PayloadTooLargeProblem'
              example:
                type: urn:problem:url-shortener:payload-too-large
                title: The request body is too large
                status: 413
        '415':
          description: Request body is not application/json
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            Accept-Post:
              description: The media type the endpoint accepts.
              schema:
                type: string
                example: application/json
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/UnsupportedMediaTypeProblem'
              example:
                type: urn:problem:url-shortener:unsupported-media-type
                title: The content type is not supported
                status: 415
        '500':
          $ref: '#/components/responses/InternalError'

  /openapi.yaml:
    get:
      summary: Get this API contract
      responses:
        '200':
          description: This OpenAPI document
          content:
            application/yaml:
              schema:
                type: string

  /{alias}:
    get:
      summary: Redirect to destination URL
      description: |
        Redirects are never cached. A request with
        `Accept: text/html` for an unknown alias gets a small HTML
        "link not found" page, instead of a problem body.
      parameters:
        - $ref: '#/components/parameters/Alias'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '302':
          description: Redirect to the original URL
          headers:
            Location:
              description: The destination URL, as stored.
              schema:
                type: string
                example: https://example.com/very/long/url
            Cache-Control:
              description: Always `no-store`, so a deleted alias stops resolving at once.
              schema:
                type: string
                example: no-store
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    delete:
      summary: Delete a shortened URL
      parameters:
        - $ref: '#/components/parameters/Alias'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '204':
          description: Successfully deleted
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /urls:
    get:
      summary: List all shortened URLs
      description: Newest first. URLs created at the same instant are ordered by alias.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: A list of shortened URLs
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    alias:
                      type: string
                      example: my-custom-alias
                    fullUrl:
                      type: string
                      example: https://example.com/very/long/url
                    shortUrl:
                      type: string
                      example: http://localhost:8080/my-custom-alias
        '500':
          $ref: '#/components/responses/InternalError'

components:
  parameters:
    Alias:
      name: alias
      in: path
      required: true
      description: |
        A valid alias is 3 to 64 characters from `A-Z`, `a-z`, `0-9`, `-`
        and `_`. A value that can't be an alias gets the same `404` as one
        that doesn't exist.
      schema:
        type: string
        example: my-custom-alias
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      description: |
        Correlates log lines across the web client and the API. Generated
        by the API if absent, and always echoed in the response.
      schema:
        type: string

  headers:
    RequestId:
      description: The request ID, accepted from the request or generated.
      schema:
        type: string
        example: 6f1c0f8e-2c1d-4a53-9e55-1d3c1b7a9c10

  responses:
    NotFound:
      description: Alias not found
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/NotFoundProblem'
          example:
            type: urn:problem:url-shortener:not-found
            title: The alias was not found
            status: 404
    InternalError:
      description: |
        Unexpected fault. The body exposes no internal detail, only the
        request ID.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/InternalErrorProblem'
          example:
            type: urn:problem:url-shortener:internal-error
            title: Something went wrong
            status: 500
            detail: Quote request ID 6f1c0f8e-2c1d-4a53-9e55-1d3c1b7a9c10 when reporting this.

  schemas:
    Problem:
      type: object
      description: |
        Base RFC 9457 problem details object. Each kind of error extends it
        with a fixed `type` and `status` (see the schemas below).
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          description: A fixed URN identifying the kind of error.
        title:
          type: string
          description: A short, fixed summary of the kind of error.
        status:
          type: integer
          description: The HTTP status code, repeated from the response.
        detail:
          type: string
          description: An explanation specific to this occurrence.

    MalformedRequestProblem:
      description: The body is not valid JSON, or not a JSON object.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            type:
              type: string
              enum: [urn:problem:url-shortener:malformed-request]
            status:
              type: integer
              enum: [400]

    ValidationFailedProblem:
      description: One or more field rules were broken. `errors` lists every one.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required:
            - errors
          properties:
            type:
              type: string
              enum: [urn:problem:url-shortener:validation-failed]
            status:
              type: integer
              enum: [400]
            errors:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/FieldError'

    AliasTakenProblem:
      description: The `customAlias` already exists.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            type:
              type: string
              enum: [urn:problem:url-shortener:alias-taken]
            status:
              type: integer
              enum: [400]

    NotFoundProblem:
      description: The alias doesn't exist, or can't exist.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            type:
              type: string
              enum: [urn:problem:url-shortener:not-found]
            status:
              type: integer
              enum: [404]

    PayloadTooLargeProblem:
      description: The request body is larger than 16 KiB.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            type:
              type: string
              enum: [urn:problem:url-shortener:payload-too-large]
            status:
              type: integer
              enum: [413]

    UnsupportedMediaTypeProblem:
      description: The request `Content-Type` is not `application/json`.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            type:
              type: string
              enum: [urn:problem:url-shortener:unsupported-media-type]
            status:
              type: integer
              enum: [415]

    InternalErrorProblem:
      description: |
        An unexpected fault. `detail` carries only the request ID, never
        internal detail.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            type:
              type: string
              enum: [urn:problem:url-shortener:internal-error]
            status:
              type: integer
              enum: [500]

    FieldError:
      type: object
      required:
        - field
        - code
        - message
      properties:
        field:
          type: string
          enum:
            - fullUrl
            - customAlias
        code:
          type: string
          enum:
            - url-required
            - url-too-long
            - url-invalid
            - url-unsupported-scheme
            - url-has-credentials
            - url-self-referential
            - alias-invalid-characters
            - alias-invalid-length
            - alias-reserved
        message:
          type: string
          description: Written for end users, and shown verbatim by the web client.
