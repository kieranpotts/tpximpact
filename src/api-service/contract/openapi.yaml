openapi: 3.0.3
info:
  title: URL Shortener API
  version: 1.1.0
  description: Simple RESTful API for shortening URLs.

paths:
  /shorten:
    post:
      summary: Shorten a URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - fullUrl
              properties:
                fullUrl:
                  type: string
                  example: https://example.com/very/long/url
                customAlias:
                  type: string
                  example: my-custom-alias
      responses:
        '201':
          description: URL successfully shortened
          content:
            application/json:
              schema:
                type: object
                properties:
                  shortUrl:
                    type: string
                    example: http://localhost:8080/my-custom-alias
        '400':
          description: Invalid input or alias already taken
        '413':
          description: Request body is larger than 16 KiB
        '415':
          description: Request body is not application/json
          headers:
            Accept-Post:
              description: The media type the endpoint accepts.
              schema:
                type: string
                example: application/json

  /openapi.yaml:
    get:
      summary: Get this API contract
      responses:
        '200':
          description: This OpenAPI document
          content:
            application/yaml:
              schema:
                type: string

  /{alias}:
    get:
      summary: Redirect to full URL
      parameters:
        - name: alias
          in: path
          required: true
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the original URL
        '404':
          description: Alias not found

    delete:
      summary: Delete a shortened URL
      parameters:
        - name: alias
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Successfully deleted
        '404':
          description: Alias not found

  /urls:
    get:
      summary: List all shortened URLs
      responses:
        '200':
          description: A list of shortened URLs
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    alias:
                      type: string
                      example: my-custom-alias
                    fullUrl:
                      type: string
                      example: https://example.com/very/long/url
                    shortUrl:
                      type: string
                      example: http://localhost:8080/my-custom-alias
