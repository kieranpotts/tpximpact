#
# Lint the repository's files for compliance with .editorconfig.
#
# https://github.com/editorconfig-checker/editorconfig-checker
#

name: Lint EditorConfig

on:
  push:
    branches:
      - "**"

permissions:
  contents: read

# Only the newest run per branch is useful. Cancel any run that a
# subsequent push has superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-editorconfig:
    name: Lint EditorConfig compliance
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # This action only downloads the `editorconfig-checker` binary and adds
      # it to PATH — it does not run the checker. The `version` input MUST be
      # an exact release tag of the checker itself.
      - name: Install EditorConfig checker
        uses: editorconfig-checker/action-editorconfig-checker@840e866d93b8e032123c23bac69dece044d4d84c # v2.2.0
        with:
          version: v3.8.0

      # Given no file arguments, the checker tests every file tracked by Git.
      # The `github-actions` output format reports violations as annotations
      # against the offending lines.
      - name: Run EditorConfig checker
        run: editorconfig-checker -format github-actions
