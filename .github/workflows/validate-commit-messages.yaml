#
# Validate commit message formats.
#

name: Validate Commit Messages

on:
  push:
    branches:
      - "**"

permissions:
  contents: read

# Only the newest run per branch is useful. Cancel any run that a
# subsequent push has superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-commit-messages:
    name: Validate commit messages on all branches
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:

      # Checkout the repository and fetch its full log history.
      # https://github.com/actions/checkout?tab=readme-ov-file#fetch-all-history-for-all-tags-and-branches
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate new commit messages
        uses: kieranpotts/actions/validate-commit-messages@latest/dev
